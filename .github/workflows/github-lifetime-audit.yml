name: GitHub lifetime engineering audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/github_lifetime_audit.py'
      - 'scripts/render_profile_dashboard.py'
      - 'scripts/render_interactive_profile.py'
      - 'scripts/render_motion_profile.py'
      - 'scripts/build_linguist_index.py'
      - 'scripts/annotate_audit_markdown.py'
      - '.github/workflows/github-lifetime-audit.yml'
  schedule:
    # First day of every month at 00:15 Asia/Kolkata.
    - cron: '15 0 1 * *'
      timezone: 'Asia/Kolkata'

permissions:
  contents: write

concurrency:
  group: profile-publication
  cancel-in-progress: false

jobs:
  lifetime-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      AUDIT_TOKEN: ${{ secrets.GH_AUDIT_READ_TOKEN }}
      AUDIT_USER: christo-zero-john
      AUDIT_EMAILS: ${{ vars.AUDIT_EMAILS }}
      AUDIT_NAMES: ${{ vars.AUDIT_NAMES }}
      AUDIT_AGENT_IDENTIFIERS: ${{ vars.AUDIT_AGENT_IDENTIFIERS }}
      AUDIT_LINGUIST_INDEX: /tmp/github-linguist-languages.json
      AUDIT_GLOBAL_DISCOVERY: 'true'
      AUDIT_INCLUDE_FORKS: 'true'
      AUDIT_SHOW_PRIVATE_NAMES: 'true'
      AUDIT_AGENT_COLLAB_REPOS: 'false'
      AUDIT_CURRENT_LANGUAGES: 'true'
      AUDIT_WORKERS: '3'
      AUDIT_CLONE_TIMEOUT_SECONDS: '900'
      AUDIT_GIT_LOG_TIMEOUT_SECONDS: '1200'
      AUDIT_DISCOVERY_MAX_QUERIES: '120'

    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install audit and motion dependencies
        run: python -m pip install 'PyYAML==6.0.2' 'Pillow>=11,<13'

      - name: Build official GitHub Linguist classification index
        run: python scripts/build_linguist_index.py

      - name: Run audit integration tests
        run: python -m unittest discover -s tests -v

      - name: Check read token
        shell: bash
        run: |
          if [[ -z "$AUDIT_TOKEN" ]]; then
            echo 'Missing GH_AUDIT_READ_TOKEN. Add a read token to Actions repository secrets.' >&2
            exit 1
          fi

      - name: Generate full lifetime report
        run: python scripts/github_lifetime_audit.py

      - name: Show coverage status
        shell: bash
        run: |
          STATUS=$(cat docs/github-audit/STATUS.txt)
          echo "Coverage: $STATUS"
          if [[ "$STATUS" == 'PARTIAL' ]]; then
            echo '::warning::Some repositories or GitHub API searches were incomplete. The report explicitly marks PARTIAL.'
          fi

      - name: Add expanded in-table explanations and audit appendix
        run: python scripts/annotate_audit_markdown.py

      - name: Render premium README dashboard from latest strict audit
        run: python scripts/render_profile_dashboard.py

      - name: Render animated project cards, navigation and interactive README
        run: python scripts/render_interactive_profile.py

      - name: Render true GIF animation and premium navigation
        run: python scripts/render_motion_profile.py

      - name: Save Markdown and JSON into profile repository
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/github-audit assets/
          if git diff --cached --quiet; then
            echo 'No report changes.'
          else
            git commit -m 'docs: update lifetime GitHub audit [skip ci]'
            git push
          fi
