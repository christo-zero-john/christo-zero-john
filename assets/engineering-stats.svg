<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 225" role="img" aria-label="121 owned repositories, 89 public, 32 private, and 4 collaborations">
    <defs>
    <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1013"/><stop offset="1" stop-color="#182022"/></linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#CAF36D"/><stop offset="1" stop-color="#A6D958"/></linearGradient>
    <pattern id="texture" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#D8E7D3" stroke-opacity=".035"/></pattern>
    <style>
      .base { font-family: Inter, 'Segoe UI', Arial, sans-serif; }
      .mono { font-family: 'SFMono-Regular', Consolas, monospace; }
      .sub { font-size: 13px; font-weight: 600; letter-spacing: 2.6px; fill: #CAF36D; }
      .figure { font-size: 76px; font-weight: 750; fill: #F3F5EF; letter-spacing: -3.8px; }
      .desc { font-size: 15px; font-weight: 600; letter-spacing: 1.5px; fill: #A2B3AA; }
      .note { font-size: 13px; fill: #92A79B; }
      @keyframes pulse { 0%,100%{opacity:.55}50%{opacity:1} }
      .animate-glow {animation:pulse 4s ease-in-out infinite}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect width="1200" height="225" rx="12" fill="url(#dark)"/>
  <rect width="1200" height="225" rx="12" fill="url(#texture)"/>
  <rect x="1" y="1" width="1198" height="223" rx="11" fill="none" stroke="#405149" stroke-opacity=".75"/>
    <rect x="56" y="26" width="9" height="9" rx="2" fill="#CAF36D" class="animate-glow"/>
    <text x="77" y="35" class="sub mono">THE BUILD LOG</text>
    <text x="1144" y="35" text-anchor="end" class="note mono">UPDATED 2026-10-31</text>
    <g class="base">
      <text x="57" y="155" class="figure" fill="#F3F5EF" style="fill:#F3F5EF">121</text>
      <text x="59" y="190" class="desc">OWNED REPOSITORIES</text>
      <line x1="312" y1="98" x2="312" y2="192" stroke="#52625B" stroke-opacity=".52"/>
    </g><g class="base">
      <text x="351" y="155" class="figure" fill="#F3F5EF" style="fill:#F3F5EF">89</text>
      <text x="353" y="190" class="desc">PUBLIC</text>
      <line x1="606" y1="98" x2="606" y2="192" stroke="#52625B" stroke-opacity=".52"/>
    </g><g class="base">
      <text x="645" y="155" class="figure" fill="#CAF36D" style="fill:#CAF36D">32</text>
      <text x="647" y="190" class="desc">PRIVATE</text>
      <line x1="900" y1="98" x2="900" y2="192" stroke="#52625B" stroke-opacity=".52"/>
    </g><g class="base">
      <text x="939" y="155" class="figure" fill="#F3F5EF" style="fill:#F3F5EF">4</text>
      <text x="941" y="190" class="desc">COLLABORATIONS</text>
      
    </g>
    <rect x="56" y="207" width="1088" height="1" fill="#4D5B54" opacity=".55"/>
    <rect x="56" y="206" width="120" height="3" fill="#CAF36D"/>
  </svg>