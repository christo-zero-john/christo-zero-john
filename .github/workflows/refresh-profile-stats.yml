name: Refresh private-safe GitHub profile metrics

on:
  workflow_dispatch:
  schedule:
    - cron: '16 4 * * *'

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate anonymous aggregate statistics
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          MIN_EXPECTED_PRIVATE_REPOS: '32'
        run: node scripts/update-stats.mjs
      - name: Publish updated images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/engineering-stats.svg assets/contribution-grid.svg
          if git diff --cached --quiet; then
            echo 'No changes to publish.'
            exit 0
          fi
          git commit -m 'chore(profile): refresh anonymous GitHub metrics'
          git push
