<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="hero-title hero-desc">
<title id="hero-title">Christo John — Full-Stack Product Engineer</title>
<desc id="hero-desc">Editorial dark graphite header with oversized type, subtle electric-lime accents, and a custom CJ monogram.</desc>
<defs>
  <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#0B1013"/><stop offset=".65" stop-color="#10171A"/><stop offset="1" stop-color="#151D1F"/>
  </linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#CDF76B"/><stop offset="1" stop-color="#A7DA4A"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#CDD8CD" opacity=".055"/></pattern>
  <radialGradient id="aura"><stop stop-color="#B6E95D" stop-opacity=".13"/><stop offset="1" stop-color="#B6E95D" stop-opacity="0"/></radialGradient>
  <clipPath id="mask"><rect x="1" y="1" width="1198" height="338" rx="12"/></clipPath>
  <style>
   .sans{font-family:Inter,"Segoe UI",Arial,sans-serif}
   .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
   @keyframes blink{0%,100%{opacity:.42}50%{opacity:1}}
   @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
   .pulse{animation:blink 4s ease-in-out infinite}
   .mark{animation:float 9s ease-in-out infinite;transform-origin:960px 190px}
   @media(prefers-reduced-motion:reduce){.pulse,.mark{animation:none!important}}
  </style>
</defs>
<rect width="1200" height="340" rx="13" fill="url(#back)"/>
<g clip-path="url(#mask)">
  <rect width="1200" height="340" fill="url(#grid)"/>
  <ellipse cx="987" cy="166" rx="305" ry="288" fill="url(#aura)"/>
  <path d="M738 0V340" stroke="#50605C" stroke-opacity=".45"/>
  <path d="M791 65H1150M791 282H1150" stroke="#B7C7BA" stroke-opacity=".22"/>
  <path d="M1125 49h25v25M790 276v25h25" fill="none" stroke="#C0D1C2" opacity=".22"/>
  <g class="mark" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M957 111C930 91 897 91 875 107C846 127 840 156 840 190C840 227 858 262 896 273C920 280 942 275 960 260" stroke="#DDE8DE" stroke-width="19"/>
    <path d="M1057 104V239C1057 273 1037 285 1000 282" stroke="#DDE8DE" stroke-width="19"/>
    <path d="M957 111C930 91 897 91 875 107" stroke="url(#neon)" stroke-width="19"/>
    <circle cx="963" cy="260" r="9.5" fill="#C8F467" stroke="none" class="pulse"/>
  </g>
  <g class="sans">
    <text x="74" y="55" font-size="13" font-weight="600" letter-spacing="3.1" fill="#C8F467">ENGINEERING <tspan fill="#78908B">/</tspan> DESIGN <tspan fill="#78908B">/</tspan> APPLIED AI</text>
    <text x="67" y="160" font-size="100" font-weight="750" letter-spacing="-4.3" fill="#F3F5EF">CHRISTO</text>
    <text x="67" y="263" font-size="100" font-weight="750" letter-spacing="-4.3" fill="#F3F5EF">JOHN<tspan fill="#C8F467">.</tspan></text>
    <text x="74" y="305" font-size="16" font-weight="500" letter-spacing="1.8" fill="#A2B3AA">FULL-STACK PRODUCT ENGINEER</text>
  </g>
  <rect x="73" y="325" width="1080" height="1" fill="#50615B" opacity=".50"/>
  <rect x="73" y="324" width="130" height="3" fill="#C8F467"/>
  <text class="mono" x="1146" y="311" font-size="11" text-anchor="end" letter-spacing="1.1" fill="#9DAFA6">KERALA · INDIA</text>
</g>
<rect x=".75" y=".75" width="1198.5" height="338.5" rx="12.5" fill="none" stroke="#405149" opacity=".70"/>
</svg>