<text x="629" y="44" font-size="11" fill="#A9BDB5" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" letter-spacing="0.8" text-anchor="end">RECHECK REQUIRED</text>
<text x="28" y="85" font-size="27" fill="#F4F7F3" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" letter-spacing="-0.2">Movie Watch History Tracker</text>
<text x="29" y="119" font-size="16" fill="#A9BDB5" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500">Track viewing history and explore</text>
<text x="29" y="145" font-size="16" fill="#A9BDB5" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500">film recommendations through TMDB.</text>
