name: Verify strict GitHub attribution

on:
  pull_request:
    paths:
      - 'scripts/github_lifetime_audit.py'
      - 'scripts/build_linguist_index.py'
      - 'scripts/annotate_audit_markdown.py'
      - 'tests/**'
      - '.github/workflows/test-strict-attribution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install language metadata parser
        run: python -m pip install 'PyYAML==6.0.2' 'Pillow>=11,<13'
      - name: Verify Python syntax
        run: python -m py_compile scripts/github_lifetime_audit.py scripts/build_linguist_index.py scripts/annotate_audit_markdown.py
      - name: Fetch official GitHub Linguist language registry
        run: python scripts/build_linguist_index.py
      - name: Run all offline regression tests
        run: python -m unittest discover -s tests -v
